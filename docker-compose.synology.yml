version: "3.9"

# Synology NAS + Cloudflare Tunnel 部署版本
# 使用方法见 docs/deploy-synology.md

services:
  app:
    build: .
    container_name: aivisionradar
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./data/aivisionradar.db
      - ENABLE_SCHEDULER=true
    restart: unless-stopped
    networks:
      - radar-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aivisionradar-tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - radar-net

networks:
  radar-net:
    driver: bridge
